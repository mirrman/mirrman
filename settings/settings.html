<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="../shared/shared.css" />
    <link rel="stylesheet" href="settings.css" />
    <title>Mirrman 设置</title>
  </head>
  <body>
    <main class="card settings-card">
      <header class="page-header">
        <p class="eyebrow">PREFERENCES</p>
        <h1>Mirrman 设置</h1>
        <p>配置 Gitea 连接，并选择镜像仓库时默认使用的选项。</p>
      </header>

      <form id="settingsForm">
        <section class="settings-section" aria-labelledby="connectionHeading">
          <div class="section-heading">
            <h2 id="connectionHeading">连接</h2>
            <p>令牌仅保存在此浏览器的扩展存储中。</p>
          </div>
          <div class="field">
            <label for="giteaUrl">Gitea 实例地址</label>
            <input
              id="giteaUrl"
              type="text"
              placeholder="https://gitea.example.com"
            />
          </div>
          <div class="field token-field">
            <label for="giteaToken">Gitea Personal Access Token</label>
            <div class="token-row">
              <input
                id="giteaToken"
                type="password"
                placeholder="输入 Gitea Token"
                aria-label="Gitea Token"
              />
              <button
                type="button"
                id="toggleToken"
                class="tonal-button"
                aria-label="显示 Token"
                title="显示 Token"
              >显示</button>
            </div>
          </div>
          <div class="field">
            <label for="sourceAuthToken">源仓库访问令牌 <span>可选</span></label>
            <input
              id="sourceAuthToken"
              type="password"
              placeholder="用于访问私有源仓库"
            />
          </div>
        </section>

        <section class="settings-section" aria-labelledby="defaultsHeading">
          <div class="section-heading">
            <h2 id="defaultsHeading">默认镜像选项</h2>
            <p>开始任务时可在弹出窗口中单独调整。</p>
          </div>
          <div class="field">
            <label for="descriptionStrategy">默认仓库描述策略</label>
            <select id="descriptionStrategy">
              <option value="prefix">添加镜像来源前缀</option>
              <option value="original">保留原仓库描述</option>
              <option value="empty">留空</option>
            </select>
          </div>
          <div class="field">
            <label for="default_owner">Gitea 默认仓库 Owner</label>
            <select id="default_owner">
              <option value="">（默认使用 Token 所属用户）</option>
            </select>
            <p class="helper-text">
              可从 Token 所属用户及其组织中选择；留空表示使用 Token 所属用户。
            </p>
          </div>
          <label class="toggle-option standalone-toggle" for="pref_private">
            <span>默认将仓库设为私有</span>
            <input id="pref_private" type="checkbox" />
          </label>
        </section>

        <fieldset class="settings-section included-options">
          <legend>默认包含项</legend>
          <p class="section-description">
            工单、合并请求、版本发布、里程碑 和 标签 需要源仓库访问令牌。
          </p>
          <div class="toggle-grid">
            <label class="toggle-option" for="pref_wiki">
              <span>百科</span><input id="pref_wiki" type="checkbox" checked />
            </label>
            <label class="toggle-option" for="pref_issues">
              <span>工单</span><input id="pref_issues" type="checkbox" checked />
            </label>
            <label class="toggle-option" for="pref_pull_requests">
              <span>合并请求</span><input id="pref_pull_requests" type="checkbox" checked />
            </label>
            <label class="toggle-option" for="pref_releases">
              <span>版本发布</span><input id="pref_releases" type="checkbox" checked />
            </label>
            <label class="toggle-option" for="pref_milestones">
              <span>里程碑</span><input id="pref_milestones" type="checkbox" checked />
            </label>
            <label class="toggle-option" for="pref_labels">
              <span>标签</span><input id="pref_labels" type="checkbox" checked />
            </label>
          </div>
        </fieldset>

        <section class="settings-section additional-options" aria-label="其他默认选项">
          <label class="toggle-option" for="pref_lfs">
            <span>
              <strong>LFS</strong>
              <small>启用大文件存储；endpoint 需在每次镜像时单独指定。</small>
            </span>
            <input id="pref_lfs" type="checkbox" />
          </label>
          <label class="toggle-option" for="pref_mirror">
            <span>
              <strong>镜像仓库</strong>
              <small>关闭后，默认只迁移仓库，不持续同步。</small>
            </span>
            <input id="pref_mirror" type="checkbox" checked />
          </label>
        </section>

        <footer class="actions">
          <span id="status" role="status" aria-live="polite"></span>
          <div class="action-buttons">
            <button type="button" id="testToken" class="tonal-button">测试连接</button>
            <button type="submit">保存设置</button>
          </div>
        </footer>
      </form>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
